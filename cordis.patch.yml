# ============================================================================
# dsh-feiyu-life —— DSH bundle patch
# ============================================================================
# 大肥鱼人生引擎的挂载声明。
#
# 安装（本地开发，link 到源码目录）：
#   dsh plugin --profile web add "link:D:/teleagent_workspace/travel-feiyu/dsh-feiyu-life"
# 安装（从 GitHub）：
#   dsh plugin --profile web add github:<你的用户名>/dsh-feiyu-life
# 卸载：
#   dsh plugin --profile web remove dsh-feiyu-life
#
# ⚠️ insert 的 `name:` 必须与安装后的包名完全一致，否则 DSH 找不到模块
#    （表现为「装上了但路由 404」，whale-girl-live2d 作者踩过同样的坑）。
# ============================================================================

- insert:
    - id: dsh-feiyu-life
      name: dsh-feiyu-life
